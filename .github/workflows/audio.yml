name: Tự động tạo audio mẫu

on:
  workflow_dispatch:            # nút "Run workflow" trong tab Actions
    inputs:
      voices:
        description: 'Chỉ sinh các giọng này, cách nhau bằng dấu cách (ví dụ: bac-f nam-m). Để trống = cả 6 giọng'
        required: false
        default: ''
  schedule:
    - cron: '0 18 * * *'        # mỗi ngày 18:00 UTC (1 giờ sáng giờ Việt Nam): tự nhặt câu mới trong Google Sheet
  push:
    paths:
      - 'tools/gen_audio.py'    # sửa script thì chạy lại

permissions:
  contents: write               # để ghi file audio vào repo
  pages: write                  # để yêu cầu GitHub Pages dựng lại trang

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lưu bộ nhớ đệm mô hình giọng đọc
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vieneu-v3-turbo-model

      - name: Cài VieNeu-TTS
        run: pip install vieneu==3.8.4

      - name: Sinh audio cho các câu chưa có
        env:
          AUDIO_BUDGET_MIN: '270'      # tối đa 4,5 giờ mỗi lần; phần chưa xong sẽ làm ở lần sau
        run: python tools/gen_audio.py ${{ github.event.inputs.voices }}

      - name: Đưa audio mới vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "Không có file audio mới."
          else
            git commit -m "Tự động thêm audio mẫu"
            git pull --rebase
            git push
          fi

      - name: Yêu cầu GitHub Pages dựng lại trang
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Bỏ qua (Pages sẽ tự dựng lại)."
